<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DONGMULBW: Link Vet</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <!-- 상단 로고 및 제목 -->
      <header class="header">
        <img
          src="assets/dongmulbw-logo.jpeg"
          alt="DONGMULBW 로고"
          class="logo"
        />
        <h1>DONGMULBW: Link Vet</h1>
      </header>

      <section class="site-section">
        <p class="section-label">현재 접속한 사이트</p>
        <div class="site-url">
          <span>🌐</span>
          <span id="url">확인 중...</span>
        </div>
      </section>

      <!-- 최종 위험도 -->
      <section id="status-box" class="status-box">
        <h2 id="status">분석 중...</h2>
        <p id="status-message">현재 사이트를 검사하고 있습니다.</p>
      </section>

      <section class="results">
        <div class="more-section">
          <button id="toggleDetailsBtn" class="more-link" type="button">
            더보기
          </button>

          <div id="detailBox" class="detail-box hidden">
            <div id="detailExtra" class="detail-extra">
              <p>
                - 본 서비스는 <strong>규칙 기반 검사</strong>와
                <strong>RF(Random Forest) 검사</strong>를 함께 사용합니다.
              </p>
              <p>
                - 최종 점수는
                <strong>규칙 기반 검사 70% + RF 검사 30%</strong>로 계산됩니다.
              </p>
            </div>
          </div>
        </div>
      </section>

      <button id="retry" class="retry-button" type="button">다시 검사</button>
    </main>
  </body>
</html>
