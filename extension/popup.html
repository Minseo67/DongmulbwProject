<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DONGMULBW: Link Vet</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <!-- 상단 로고 및 제목 -->
      <header class="header">
        <img
          src="assets/dongmulbw-logo.jpeg"
          alt="DONGMULBW 로고"
          class="logo"
        />
        <h1>DONGMULBW: Link Vet</h1>
      </header>

      <section class="site-section">
        <p class="section-label">현재 접속한 사이트</p>
        <div class="site-url">
          <span>🌐</span>
          <span id="url">확인 중...</span>
        </div>
      </section>

      <!-- 최종 위험도 -->
      <section id="status-box" class="status-box">
        <h2 id="status">분석 중...</h2>
        <p id="status-message">현재 사이트를 검사하고 있습니다.</p>
      </section>

      <section class="results">
        <!-- 블랙리스트 -->
        <div class="result-row">
          <span>블랙리스트 검사</span>
          <strong id="blacklist-result">검사 중</strong>
        </div>

        <!-- 규칙 기반 검사 -->
        <div class="result-group">
          <div class="result-row">
            <span>규칙 기반 검사</span>
            <strong id="score">—점</strong>
          </div>

          <button
            id="rule-toggle"
            class="detail-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="rule-details"
          >
            자세히 보기
          </button>

          <div id="rule-details" class="detail-box" hidden>
            <h3>규칙 기반 검사 상세 결과</h3>
            <div id="findings"></div>
            <div class="detail-total">
              <span>최종 점수</span>
              <strong id="rule-total">—점</strong>
            </div>
          </div>
        </div>

        <!-- RF 검사 -->
        <div class="result-group">
          <div class="result-row">
            <span>RF 검사</span>
            <strong id="rf-result">검사 중</strong>
          </div>

          <button
            id="rf-toggle"
            class="detail-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="rf-details"
          >
            자세히 보기
          </button>

          <div id="rf-details" class="detail-box" hidden>
            <h3>Random Forest 검사 상세 결과</h3>

            <div class="probability-row">
              <span>악성 예측 점수</span>
              <strong id="rf-probability">—%</strong>
            </div>

            <div class="progress-bar">
              <div id="rf-fill"></div>
            </div>

            <p id="rf-description"></p>
            <p class="detail-note">
              모델 예측 점수이며 실제 악성 확률을 보장하지 않습니다.
            </p>
          </div>
        </div>
      </section>

      <button id="retry" class="retry-button" type="button">다시 검사</button>
    </main>
  </body>
</html>
